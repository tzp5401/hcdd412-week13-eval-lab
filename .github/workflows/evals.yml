name: evals

on:
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Start mock LLM
        env:
          MOCK_COMPLIANCE: strict
        run: python mock_llm/server.py > mock_llm.log 2>&1 &

      - name: Wait for mock LLM
        run: curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:9000/health

      - name: Run unit tests
        run: pytest

      - name: Run lint
        run: flake8 app evals tests mock_llm --max-line-length 100

      - name: Run evaluations
        env:
          PROMPT_VERSION: v2
        run: python evals/run_evals.py --prompt-version v2 --min-pass-rate 0.9 --baseline report-v2.json
